# ── Price thresholds ────────────────────────────────────────────────
# Deals under great_deal_usd are flagged and sent to Discord immediately.
price:
  absolute_max_usd: 15000
  great_deal_usd:
    car: 6000
  good_deal_usd:
    car: 8000
  top_deals_count: 10
  suspicious_price_ratio: 0.5
  suspicious_min_sample: 3
  source_reliability: {}

# ── Alerts ──────────────────────────────────────────────────────────
alerts:
  email:
    enabled: false
    smtp_server: ${SMTP_HOST}
    smtp_port: 587
  discord:
    enabled: true

# ── Discord webhooks ────────────────────────────────────────────────
# Each product type has its own Discord channel/webhook.
discord:
  webhooks:
    laptop: ${DISCORD_WEBHOOK_URL_LAPTOP}
    phone: ${DISCORD_WEBHOOK_URL_PHONE}
    monitor: ${DISCORD_WEBHOOK_URL_MONITOR}
    gpu: ${DISCORD_WEBHOOK_URL_GPU}
    cpu: ${DISCORD_WEBHOOK_URL_CPU}
    console: ${DISCORD_WEBHOOK_URL_CONSOLE}
    camera: ${DISCORD_WEBHOOK_URL_CAMERA}
    audio: ${DISCORD_WEBHOOK_URL_AUDIO}
    storage: ${DISCORD_WEBHOOK_URL_STORAGE}
    network: ${DISCORD_WEBHOOK_URL_NETWORK}
    pc: ${DISCORD_WEBHOOK_URL_PC}
    tablet: ${DISCORD_WEBHOOK_URL_TABLET}
    other: ${DISCORD_WEBHOOK_URL}
    car: ${DISCORD_WEBHOOK_URL_CAR}

# ── Sites ───────────────────────────────────────────────────────────
# applicable_product_types restricts a site to specific product types.
# Set to null (omitted) to allow all product types.
sites:
  # Apple-specific marketplace (disabled for car searches)
  apple:
    enabled: false

  # General electronics (disabled for car searches)
  facebook:
    enabled: false
    # Re-enable when ready to set up session cookie (note: violates Facebook ToS)
    # applicable_product_types:

  marketplace:
    enabled: false

  amazon:
    enabled: false

  craigslist:
    enabled: true
    applicable_product_types:
      - car
    base_url: https://phoenix.craigslist.org
    search_path: /search/cta

  offerup:
    enabled: true
    applicable_product_types:
      - car

  ebay:
    enabled: true
    applicable_product_types:
      - car

  cargurus:
    enabled: true
    applicable_product_types:
      - car

  autotrader:
    enabled: false
    # Blocked by Akamai bot protection - needs residential proxy to work
    applicable_product_types:
      - car
    base_url: https://www.autotrader.com

  bestbuy:
    enabled: false

  newegg:
    enabled: false

  bhphotovideo:
    enabled: false

  amazonaws:
    enabled: false
