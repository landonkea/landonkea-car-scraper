# ───────────────────────────────────────────────────────────────────
# Config file for car scraper
# ───────────────────────────────────────────────────────────────────
# All marketplace sites, search parameters, and alert settings
# are configured here. Never commit this file with real API keys.
# ───────────────────────────────────────────────────────────────────

environment: dev

# ── Schedule ────────────────────────────────────────────────────────
schedule:
  enabled: true
  interval_hours: 6

# ── Locations ───────────────────────────────────────────────────────
# Multiple Arizona locations to search
locations:
  - name: "Phoenix"
    zip: "85001"
    regions:
      - phoenix
  - name: "Tucson"
    zip: "85701"
    regions:
      - tucson
  - name: "Flagstaff"
    zip: "86001"
    regions:
      - flagstaff

# ── Global ─────────────────────────────────────────────────────────
request_timeout: 40

database:
  url: sqlite:///data/listings.db

# ── Searches ───────────────────────────────────────────────────────
# Each entry is a separate product search that runs sequentially.
searches:
  - product_name: "Toyota Yaris (2015+, automatic)"
    product_type: car
    min_year: 2015
    max_mileage: 150000
    transmission: automatic
    min_doors: 4
    title_status: clean
    preferred_brands:
      - Toyota
    min_price: 500
    results_per_size: 45

